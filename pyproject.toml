[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market"
version = "0.0.1"
description = "Broker-agnostic BTC spot autotrader (Robinhood adapter optional)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[project.scripts]
market = "market.app.cli:main"

# src/ layout: map src/market -> market in the wheel / editable install
[tool.hatch.build.targets.wheel]
packages = ["src/market"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
