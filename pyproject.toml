[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market"
version = "0.0.1"
description = "Broker-agnostic BTC spot autotrader (Robinhood adapter optional)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "keyring>=25.0",
  "pynacl>=1.5",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "types-PyYAML>=6.0",
]

[project.scripts]
market = "market.app.cli:main"

# src/ layout: map src/market -> market in the wheel / editable install
[tool.hatch.build.targets.wheel]
packages = ["src/market"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = [
  "integration: requires external network access and is excluded from the default suite",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
  # Decimal constructed from a string is deliberate for exact monetary values.
  "FURB157",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["market"]
omit = [
  "*/market/__main__.py",
  "*/market/app/cli.py",
  "*/market/data/candles.py",
  "*/market/execution/port.py",
]
